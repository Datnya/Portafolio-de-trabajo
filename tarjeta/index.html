<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#1A1A1A" />
  <meta name="description" content="Tarjeta digital de Datnya Monzón." />
  <title>Tarjeta digital | Datnya Monzón</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../networking/networking.css" />
  <script defer src="../networking/contact-config.js"></script>
  <script defer src="../networking/networking.js"></script>
</head>
<body class="networking-page" data-page="tarjeta">
  <main class="networking-shell">
    <article class="networking-card business-card" aria-labelledby="card-name">
      <div class="business-card__identity">
        <div class="business-card__profile">
          <div class="portrait portrait--card">
            <img src="../assets/datnya-foto.webp" width="1000" height="1414" alt="Retrato de Datnya Monzón" fetchpriority="high" />
          </div>
          <div>
            <h1 id="card-name">Datnya Monzón</h1>
            <p class="identity-role">Desarrolladora de Software y Soluciones Web</p>
          </div>
        </div>
      </div>
      <div class="qr-card" aria-label="Código QR de contacto">
        <div class="qr-card__frame">
          <img id="contact-qr" src="../networking/qr-contacto.svg" width="256" height="256" alt="Código QR para abrir datnyamonzon.com/contacto" />
        </div>
        <p class="qr-card__instruction">Escanea para guardar mi contacto y ver mis proyectos</p>
        <p class="qr-card__domain">datnyamonzon.com</p>
      </div>
    </article>
  </main>
</body>
</html>
